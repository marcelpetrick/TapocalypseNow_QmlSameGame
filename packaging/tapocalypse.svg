<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Tapocalypse app icon: four neon tiles in the board palette, one of them popping. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D19"/>
      <stop offset="1" stop-color="#07080F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#5500ea" stroke-opacity="0.6" stroke-width="4"/>
  <g filter="url(#glow)">
    <rect x="44" y="44" width="76" height="76" rx="16" fill="#00E5FF"/>
    <rect x="136" y="44" width="76" height="76" rx="16" fill="#FF00E5"/>
    <rect x="44" y="136" width="76" height="76" rx="16" fill="#00FFAE"/>
    <rect x="144" y="144" width="60" height="60" rx="14" fill="#FFD400" stroke="#ffffff" stroke-width="5"/>
  </g>
  <rect x="44" y="44" width="76" height="76" rx="16" fill="url(#shine)"/>
  <rect x="136" y="44" width="76" height="76" rx="16" fill="url(#shine)"/>
  <rect x="44" y="136" width="76" height="76" rx="16" fill="url(#shine)"/>
  <!-- pop sparks around the yellow tile -->
  <g stroke="#FFD400" stroke-width="6" stroke-linecap="round">
    <line x1="174" y1="126" x2="174" y2="114"/>
    <line x1="222" y1="174" x2="234" y2="174"/>
    <line x1="208" y1="140" x2="217" y2="131"/>
    <line x1="208" y1="208" x2="217" y2="217"/>
  </g>
</svg>
