name: Release

# Push a tag such as v1.2.3 to build, test and package Tapocalypse for Linux, Windows and macOS and publish the
# archives as a GitHub release. Run it manually to get the archives as workflow artifacts without releasing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: 6.12.0
  # AppImage tooling, pinned by release and checksum (sha256 from the GitHub release asset digests).
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  package:
    name: Package · ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04 # oldest supported glibc for the widest Linux compatibility
          - platform: windows-x86_64
            os: windows-2022
          - platform: macos-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1 libpulse0 libpulse-mainloop-glib0 libxcb-cursor0 xvfb weston

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          cache: true
          # aqtinstall 3.3.0 (latest release) cannot read the per-architecture Windows repository layout used since
          # Qt 6.11; the fix (miurahr/aqtinstall#1000) is merged but unreleased, so pin that upstream commit.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "name=tapocalypse-${version}-${{ matrix.platform }}" >> "${GITHUB_OUTPUT}"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTAPOCALYPSE_DEPLOY_QT=ON -DTAPOCALYPSE_VERSION=${{ steps.version.outputs.version }} ${{ runner.os == 'Linux' && '-G Ninja' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure --timeout 300
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Install into a self-contained folder
        run: cmake --install build --config Release --prefix "stage/${{ steps.version.outputs.name }}"

      - name: Seal the macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Deployment rewrites the bundled frameworks, which breaks their signatures; Apple silicon refuses to start
          # a bundle with broken signatures ("damaged"). Re-seal it ad hoc and prove the seal holds.
          app="stage/${{ steps.version.outputs.name }}/tapocalypse.app"
          codesign --force --deep --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"

      - name: Build the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tools="${RUNNER_TEMP}/appimage-tools"; mkdir -p "${tools}"
          curl -fsSLo "${tools}/appimagetool" "${APPIMAGETOOL_URL}"
          curl -fsSLo "${tools}/runtime-x86_64" "${APPIMAGE_RUNTIME_URL}"
          printf '%s  %s\n' "${APPIMAGETOOL_SHA256}" "${tools}/appimagetool" "${APPIMAGE_RUNTIME_SHA256}" "${tools}/runtime-x86_64" | sha256sum -c -
          chmod +x "${tools}/appimagetool"
          tools/make_appimage.sh "stage/${{ steps.version.outputs.name }}" "stage/${{ steps.version.outputs.name }}.AppImage" \
            "${tools}/appimagetool" "${tools}/runtime-x86_64"

      - name: Smoke-test the packaged app
        shell: bash
        run: |
          root="stage/${{ steps.version.outputs.name }}"
          # Run the archive as a user would get it: hide the CI Qt installation (plugin/QML paths and PATH entries)
          # so only bundled libraries, plugins and QML modules can satisfy the app, on the platform's real backend.
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH QML_IMPORT_PATH QT_QPA_PLATFORM_PLUGIN_PATH QT_QPA_PLATFORM
          PATH="$(printf '%s' "${PATH}" | tr ':' '\n' | grep -v '/Qt/' | paste -sd: -)"

          # smoke <label> <app> <launcher...>: start the app, require it to keep running and to report no missing parts.
          smoke() {
            local label="$1" app="$2"; shift 2
            local log="${RUNNER_TEMP}/smoke-${label}.log"
            "$@" "${app}" --windowed > "${log}" 2>&1 &
            local pid=$!
            sleep 8
            if ! kill -0 "${pid}" 2>/dev/null; then
              local status=0; wait "${pid}" || status=$?
              cat "${log}"; echo "[${label}] app exited early with status ${status}"; exit 1
            fi
            kill "${pid}" || true
            cat "${log}"
            if grep -qiE 'could not find the qt platform plugin|could not load the qt platform plugin|module .* is not installed|failed to load|does not support customization|no qtmultimedia backends' "${log}"; then
              echo "[${label}] app started but reported missing runtime parts or an unthemed style"; exit 1
            fi
            echo "[${label}] packaged app is self-contained and running"
          }

          case "${RUNNER_OS}" in
            Linux)
              tarball_app="${root}/bin/tapocalypse"
              appimage="${root}.AppImage"
              smoke x11 "${tarball_app}" env QT_QPA_PLATFORM=xcb xvfb-run -a
              # The runner has no FUSE; extract-and-run is the AppImage's own fallback for such systems.
              smoke appimage-x11 "${appimage}" env APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb xvfb-run -a
              # Wayland-only session: no X server to fall back to, headless Weston as the compositor.
              export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg"; mkdir -p -m 0700 "${XDG_RUNTIME_DIR}"
              weston --backend=headless-backend.so --socket=tapocalypse-wl --idle-time=0 > "${RUNNER_TEMP}/weston.log" 2>&1 &
              for _ in $(seq 50); do [[ -S "${XDG_RUNTIME_DIR}/tapocalypse-wl" ]] && break; sleep 0.2; done
              smoke wayland "${tarball_app}" env -u DISPLAY QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=tapocalypse-wl
              smoke appimage-wayland "${appimage}" env -u DISPLAY APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=tapocalypse-wl
              ;;
            Windows) smoke native "${root}/bin/tapocalypse.exe" env ;;
            macOS) smoke native "${root}/tapocalypse.app/Contents/MacOS/tapocalypse" env ;;
          esac

      - name: Archive
        shell: bash
        run: |
          cp README.md LICENSE RULES.md "stage/${{ steps.version.outputs.name }}/"
          cd stage
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            tar -czf "${{ steps.version.outputs.name }}.tar.gz" "${{ steps.version.outputs.name }}"
          else
            7z a -tzip "${{ steps.version.outputs.name }}.zip" "${{ steps.version.outputs.name }}" > /dev/null
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.name }}
          path: stage/${{ steps.version.outputs.name }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Tapocalypse ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*
